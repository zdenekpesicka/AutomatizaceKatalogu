name: Mesicni import (UZIS + RUIAN)

on:
  schedule:
    - cron: "0 5 3 * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Denni a mesicni beh obojí commituji a pushuji do data/ - kdyby bezely soubezne (napr. rucni
# trigger prekryvajici se s cronem), druhy push by mohl spadnout na non-fast-forward. Skupina
# spolecna pro oba workflow serializuje jejich behy misto souboznosti.
concurrency:
  group: import-katalogu

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r import/requirements.txt

      - name: Zjisti aktualni mesic pro cache klic
        id: mesic
        run: echo "yyyymm=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Stahni UZIS + RUIAN (vzdy cerstve, ne z cache)
        run: python import/stahni_zdroje.py --uzis-ruian

      # Ulozi cerstve stazene UZIS/RUIAN soubory do cache pod klicem aktualniho mesice,
      # aby je denni beh (import.yml) mohl po zbytek mesice jen obnovovat (restore), ne
      # stahovat znovu - CLAUDE.md 5.1, UZIS a RUIAN se aktualizuji jen mesicne.
      #
      # Pozn.: klic cache je pro dany mesic nemenny. Pri druhem rucnim spusteni tohoto
      # workflow ve stejnem mesici tento krok jen tise neulozi (bez chyby) - vystup toho
      # behu je porad spravny, jen denni beh dal cerpa ze starsiho ulozeneho snapshotu az
      # do dalsiho mesice. Nizke riziko, ÚZIS/RÚIAN se stejne meni jen mesicne.
      - name: Uloz UZIS/RUIAN do cache
        uses: actions/cache/save@v4
        with:
          path: |
            _cache/nrpzs.csv
            _cache/ruian_adr.zip
            _cache/uzis_ruian_meta.json
          key: uzis-ruian-${{ steps.mesic.outputs.yyyymm }}

      - name: Stahni MPSV
        run: python import/stahni_zdroje.py --mpsv

      - name: Sestav katalog
        run: python import/build_katalog.py

      - name: Commituj zmeny (jen pokud nejake jsou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Zadna zmena v data/, commit se neprovadi."
          else
            git commit -m "Automaticky import: aktualizace dat UZIS/RUIAN"
            git push
          fi
