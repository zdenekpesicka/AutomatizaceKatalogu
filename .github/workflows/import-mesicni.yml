name: Rucni import (vynuti stazeni UZIS + RUIAN)

# Bez cronu, spousti se jen rucne. Dela totez co denni beh, jen UZIS a RUIAN stahuje vzdy
# cerstve misto cteni z cache - proto "vynuti stazeni". MPSV se stahuje a katalog sestavuje
# stejne jako v dennim behu.
#
# Do 8. 9. 2026 tohle workflow behalo 3. v mesici a bylo jedinym mistem, ktere UZIS a RUIAN
# stahovalo. Od zavedeni klice cache odvozeneho od dat zdroju (viz import.yml) si novou verzi
# vezme denni beh sam v den, kdy vyjde, takze naplanovany mesicni beh uz nema co delat - jen
# by do teze cache zapisoval druhy pisatel. Zustava jako rucni pojistka pro pripad, kdy je
# potreba vynutit cerstve stazeni (poskozeny snapshot, zmena zpracovani).
on:
  workflow_dispatch: {}

permissions:
  contents: write

# Denni i rucni beh obojí commituji a pushuji do data/ - kdyby bezely soubezne (napr. rucni
# beh prekryvajici se s cronem denniho), druhy push by mohl spadnout na non-fast-forward.
# Skupina spolecna pro oba workflow serializuje jejich behy misto souboznosti.
concurrency:
  group: import-katalogu

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - run: pip install -r import/requirements-dev.txt

      # Testy bezi pred stahovanim: kdyz je rozbite zpracovani, nema smysl tahnout 190 MB dat.
      # Nesahaji na sit a chybejici _cache jim nevadi, takze uz maji vsechno, co potrebuji.
      - name: Testy
        run: python -m pytest tests/ -q

      # Sonda musi byt PRED stazenim, ne za nim. Kdyz CUZK publikuje mezi obema kroky, sonda
      # spustena az po stazeni vrati novejsi datum, nez jaka data se prave stahla, a ulozi je
      # pod klic nove verze. Takova cache je pak trvale spatne: denni beh na ni trefi presnou
      # shodu klice, takze uz nikdy nestahne - a protoze `cache/save` na obsazenem klici tise
      # skonci, neopravi to ani opakovany rucni beh. V tomto poradi je nejhorsi mozny dopad
      # opacny a neskodny: klic ukazuje starsi verzi, nez jaka se stahla, takze pristi beh
      # jednou zbytecne stahne znovu.
      - name: Zjisti verze zdroju pro klic cache
        id: verze
        run: python import/stahni_zdroje.py --verze-zdroju >> "$GITHUB_OUTPUT"

      - name: Stahni UZIS + RUIAN (vzdy cerstve, ne z cache)
        id: stazeni
        run: |
          python import/stahni_zdroje.py --uzis-ruian
          NAHRADNI=$(python -c 'import json;print(",".join(json.load(open("_cache/uzis_ruian_meta.json")).get("nahradniDatum", [])))')
          if [ -n "$NAHRADNI" ]; then
            echo "::warning title=Datum zdroje se nepodarilo zjistit::Dosazeno dnesni datum pro: $NAHRADNI. Cache se neuklada, aby se nahradni datum nezafixovalo pod platnym klicem."
          else
            echo "ulozit=true" >> "$GITHUB_OUTPUT"
          fi

      # Tentyz klic odvozeny od dat jako v import.yml, aby oba behy sdilely jednu cache misto
      # dvou navzajem si prekazejicich jmennych prostoru. Kdyz uz cache pod timto klicem je,
      # save tise skonci - stazena data jsou v tom pripade shodna s ulozenymi.
      #
      # Pozor na hranici te uvahy: shodna jsou jen velka data, meta soubor s datem zdroje shodny
      # byt nemusi. Prave proto se cache neuklada, kdyz se datum nepodarilo zjistit - jinak by
      # rucni beh nemohl slouzit ani k oprave uz otravene cache, protoze save na obsazenem klici
      # nic neprepise. Otravena cache se odstranuje smazanim (viz README, Kdyz beh selze).
      - name: Uloz UZIS/RUIAN do cache
        if: steps.stazeni.outputs.ulozit == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            _cache/nrpzs.csv
            _cache/ruian_adr.zip
            _cache/uzis_ruian_meta.json
          key: ${{ steps.verze.outputs.klic }}

      - name: Stahni MPSV
        run: python import/stahni_zdroje.py --mpsv

      - name: Sestav katalog
        run: python import/build_katalog.py

      - name: Commituj zmeny (jen pokud nejake jsou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Zadna zmena v data/, commit se neprovadi."
          else
            git commit -m "Automaticky import: aktualizace dat"
            git push
          fi
