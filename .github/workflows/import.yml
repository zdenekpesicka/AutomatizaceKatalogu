name: Denni import

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Denni i rucni beh obojí commituji a pushuji do data/ - kdyby bezely soubezne (napr. rucni
# beh prekryvajici se s cronem denniho), druhy push by mohl spadnout na non-fast-forward.
# Skupina spolecna pro oba workflow serializuje jejich behy misto souboznosti.
concurrency:
  group: import-katalogu

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - run: pip install -r import/requirements-dev.txt

      # Testy bezi pred stahovanim: kdyz je rozbite zpracovani, nema smysl tahnout 190 MB dat.
      # Nesahaji na sit ani na _cache, takze v tuhle chvili uz maji vsechno, co potrebuji.
      - name: Testy
        run: python -m pytest tests/ -q

      # Klic cache je odvozeny od DAT zdroju, ne od kalendarniho mesice: zepta se UZIS na
      # Last-Modified a CUZK na nazev souboru v ATOM feedu (obojí levne, par kB). Kalendarni
      # klic tuto praci delat nemohl - CUZK publikuje pozdeji nez 3. v mesici, takze mesicni
      # beh sahal po o mesic starsim souboru a pod uz obsazenym klicem ho do konce mesice nic
      # nenahradilo. Kdyz je klic odvozeny od dat, novy soubor u zdroje = novy klic = cache
      # mine = stahne se, a to v nejblizsim dennim behu.
      - name: Zjisti verze zdroju UZIS a RUIAN
        id: verze
        run: python import/stahni_zdroje.py --verze-zdroju >> "$GITHUB_OUTPUT"

      # restore-keys je zachrana pro dva pripady: zdroje se zmenily (presny klic mine, ale
      # posledni verze se hodi jako podklad) a verze nejdou zjistit (klic je nahradni).
      - name: Obnov UZIS/RUIAN z cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            _cache/nrpzs.csv
            _cache/ruian_adr.zip
            _cache/uzis_ruian_meta.json
          key: ${{ steps.verze.outputs.klic }}
          restore-keys: |
            uzis-ruian-

      # Tri stavy, ktere musi dopadnout ruzne:
      #   1. presna shoda klice -> cache odpovida prave nabizenym zdrojum, nestahuje se
      #   2. nahradni klic (verze nejdou zjistit) a soubory na disku -> vypadek zdroje nesmi
      #      zastavit import MPSV, pokracuje se nad posledni ulozenou verzi
      #   3. zbytek (zdroje maji novejsi verzi, nebo cache neexistuje vubec) -> stahnout
      # Stav 3 pokryva i drivejsi samostatnou pojistku na uplne chybejici cache.
      - name: Stahni UZIS/RUIAN, kdyz cache neodpovida zdrojum
        id: dostahni
        env:
          KLIC: ${{ steps.verze.outputs.klic }}
          SHODA: ${{ steps.cache.outputs.cache-hit }}
        run: |
          if [ "$SHODA" = "true" ]; then
            echo "Cache odpovida aktualni verzi zdroju ($KLIC), nestahuje se."
          elif [ "$KLIC" = "uzis-ruian-neurceno" ] && [ -f _cache/nrpzs.csv ] && [ -f _cache/ruian_adr.zip ]; then
            echo "Verze zdroju nejdou zjistit, pokracuji nad posledni ulozenou verzi z cache."
          else
            echo "Zdroje maji novejsi verzi nebo cache chybi, stahuji UZIS a RUIAN."
            python import/stahni_zdroje.py --uzis-ruian
            echo "stahovano=true" >> "$GITHUB_OUTPUT"
          fi

      # Uklada se pod tentyz klic odvozeny od dat, takze druhy beh nad nezmenenymi zdroji
      # najde presnou shodu a uz nestahuje. Kdyz klic mezitim nekdo obsadil (dva behy tyz den),
      # save tise skonci - a je to spravne, pod stejnym klicem jsou stejna data.
      - name: Uloz UZIS/RUIAN do cache
        if: steps.dostahni.outputs.stahovano == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            _cache/nrpzs.csv
            _cache/ruian_adr.zip
            _cache/uzis_ruian_meta.json
          key: ${{ steps.verze.outputs.klic }}

      - name: Stahni MPSV
        run: python import/stahni_zdroje.py --mpsv

      - name: Sestav katalog
        run: python import/build_katalog.py

      - name: Commituj zmeny (jen pokud nejake jsou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Zadna zmena v data/, commit se neprovadi."
          else
            git commit -m "Automaticky import: aktualizace dat"
            git push
          fi
