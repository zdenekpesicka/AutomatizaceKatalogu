name: Denni import (MPSV)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Denni a mesicni beh obojí commituji a pushuji do data/ - kdyby bezely soubezne (napr. rucni
# trigger prekryvajici se s cronem), druhy push by mohl spadnout na non-fast-forward. Skupina
# spolecna pro oba workflow serializuje jejich behy misto souboznosti.
concurrency:
  group: import-katalogu

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r import/requirements.txt

      - name: Zjisti aktualni mesic pro cache klic
        id: mesic
        run: echo "yyyymm=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # UZIS a RUIAN se aktualizuji jen mesicne (CLAUDE.md 5.1). Denni beh je proto nestahuje
      # znovu, ale obnovi je z cache naplnene mesicnim workflow. Kdyby mesicni beh v danem
      # mesici jeste neprobehl, restore-keys spadne zpet na posledni dostupnou (o mesic
      # starsi) verzi - to je v souladu s tim, ze zdroje se stejne meni jen mesicne.
      - name: Obnov UZIS/RUIAN z cache
        uses: actions/cache/restore@v4
        with:
          path: |
            _cache/nrpzs.csv
            _cache/ruian_adr.zip
            _cache/uzis_ruian_meta.json
          key: uzis-ruian-${{ steps.mesic.outputs.yyyymm }}
          restore-keys: |
            uzis-ruian-

      # Pojistka pro pripad, kdy cache neexistuje vubec - ani pod klicem mesice, ani starsi.
      # Za normalniho provozu nenastane: GitHub maze cache neprecteneou 7 dni a denni beh ji
      # ctenim vyse sam obnovuje. Dojde k tomu jen tehdy, kdyz se 7 dni po sobe zadny beh
      # nedostane az sem - tedy po rucnim smazani cache, po vypnuti a zapnuti workflow (dela
      # se v etape 5 kvuli predani notifikaci) nebo po prevodu repozitare, kde dokumentace
      # GitHubu osud cache neuvadi. Bez teto pojistky by build spadl na chybejicim
      # _cache/nrpzs.csv a denni import by stal az do 3. dne dalsiho mesice.
      #
      # Podminka se pta na existenci souboru, ne na cache-hit: pri castecne shode pres
      # restore-keys je cache-hit false, ale soubory jsou na disku a stahovat se nema.
      - name: Dostahni UZIS/RUIAN, kdyz cache chybi
        id: dostahni
        run: |
          if [ -f _cache/nrpzs.csv ] && [ -f _cache/ruian_adr.zip ]; then
            echo "UZIS i RUIAN jsou z cache, nestahuji se."
          else
            echo "Cache chybi, stahuji UZIS a RUIAN."
            python import/stahni_zdroje.py --uzis-ruian
            echo "stahovano=true" >> "$GITHUB_OUTPUT"
          fi

      # Ulozi jen tehdy, kdyz se skutecne stahovalo. Bez toho by dalsi denni beh nasel cache
      # zase prazdnou a 87 MB by se stahovalo kazdy den znovu.
      #
      # Klic je zamerne jiny nez klic mesicniho workflow (uzis-ruian-<mesic>), aby mu tato
      # vetev nesahla na jeho misto. Kdyby oba ukladaly pod tentyz klic a pojistka zabrala
      # 1. nebo 2. v mesici, mesicni beh 3. by pod obsazenym klicem uz nic neulozil (save
      # pri existujicim klici jen tise skonci) a denni behy by cely mesic cetly snapshot
      # stazeny pred mesicni aktualizaci zdroju. Prefix zustava spolecny, takze restore-keys
      # tuto cache najde; jakmile mesicni beh ulozi svou, ma prednost, protoze na ni sedi
      # presny klic. run_id navic zaruci, ze ulozeni projde i pri opakovanem vypadku cache.
      - name: Uloz dostazene UZIS/RUIAN do cache
        if: steps.dostahni.outputs.stahovano == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            _cache/nrpzs.csv
            _cache/ruian_adr.zip
            _cache/uzis_ruian_meta.json
          key: uzis-ruian-${{ steps.mesic.outputs.yyyymm }}-dodatecny-${{ github.run_id }}

      - name: Stahni MPSV
        run: python import/stahni_zdroje.py --mpsv

      - name: Sestav katalog
        run: python import/build_katalog.py

      - name: Commituj zmeny (jen pokud nejake jsou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Zadna zmena v data/, commit se neprovadi."
          else
            git commit -m "Automaticky import: aktualizace dat MPSV"
            git push
          fi
